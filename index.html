<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>恐怖医院 - 官方网站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow-x:hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#0a0a0f; color:#e8e8ea;
    display:flex; flex-direction:column; min-height:100vh;
  }
  .topbar {
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px; position:sticky; top:0; z-index:50;
    background:rgba(10,10,15,.82); backdrop-filter:blur(10px);
  }
  .badge {
    font-size:12px; padding:5px 12px; border-radius:20px;
    background:rgba(220,38,38,.15); color:#ff5b5b;
    border:1px solid rgba(220,38,38,.35);
  }
  .brand { font-size:20px; font-weight:800; letter-spacing:1px; }
  .lang-switch { display:flex; gap:6px; }
  .lang-switch button {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    color:#ccc; font-size:13px; padding:5px 10px; border-radius:8px; cursor:pointer;
  }
  .lang-switch button.active { background:#dc2626; color:#fff; border-color:#dc2626; }
  .hero {
    flex:1; display:flex; flex-direction:column; justify-content:center;
    align-items:center; text-align:center; padding:40px 22px;
  }
  .icon {
    width:96px; height:96px; border-radius:22px; margin-bottom:26px;
    background:linear-gradient(135deg,#7c1d1d,#dc2626);
    display:flex; align-items:center; justify-content:center;
    font-size:46px; box-shadow:0 10px 40px rgba(220,38,38,.25);
  }
  h1 { font-size:34px; font-weight:900; margin-bottom:10px; }
  .sub { font-size:15px; color:#9a9aa0; margin-bottom:28px; line-height:1.7; }
  .tags { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:36px; }
  .tag {
    font-size:13px; padding:7px 16px; border-radius:20px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
  }
  .intro { max-width:460px; font-size:14px; line-height:1.9; color:#b8b8be; }
  .intro h3 { color:#fff; margin-bottom:14px; font-size:16px; }
  .footer {
    padding:26px 20px 40px; border-top:1px solid rgba(255,255,255,.06);
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .footer-title { font-size:14px; color:#888; margin-bottom:4px; }
  .btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .dl-btn {
    padding:13px 26px; border-radius:14px; font-size:15px; font-weight:700;
    cursor:pointer; border:none; min-width:150px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .dl-android { background:#dc2626; color:#fff; }
  .dl-windows { background:#2563eb; color:#fff; }
  .dl-ios { background:#2a2a30; color:#777; cursor:not-allowed; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="badge" data-i18n="official">官方网站</span>
    <span class="brand">恐怖医院</span>
    <div class="lang-switch">
      <button data-lang="zh" class="active">中</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <div class="hero">
    <div class="icon">🏥</div>
    <h1 data-i18n="title">恐怖医院</h1>
    <p class="sub" data-i18n="subtitle">在废弃医院中生存，揭开隐藏的真相</p>
    <div class="tags">
      <span class="tag" data-i18n="tag1">恐怖生存</span>
      <span class="tag" data-i18n="tag2">单人剧情</span>
      <span class="tag" data-i18n="tag3">离线可玩</span>
      <span class="tag" data-i18n="tag4">免费下载</span>
    </div>
    <div class="intro">
      <h3 data-i18n="introTitle">关于游戏</h3>
      <p data-i18n="introText">你在一所废弃的精神病院中醒来，黑暗中潜伏着未知的危险。探索、解谜、生存，揭开这家医院背后的黑暗实验。支持 Android 与 Windows 平台。</p>
    </div>
  </div>

  <div class="footer">
    <div class="footer-title" data-i18n="downloadTitle">选择平台下载</div>
    <div class="btns">
      <button class="dl-btn dl-android" id="download-android">📱 Android</button>
      <button class="dl-btn dl-windows" id="download-windows">💻 Windows</button>
      <button class="dl-btn dl-ios" id="download-ios">🍎 iOS（暂未发布）</button>
    </div>
  </div>

<script>
const I18N = {
  zh: {
    official:"官方网站", title:"恐怖医院", subtitle:"在废弃医院中生存，揭开隐藏的真相",
    tag1:"恐怖生存", tag2:"单人剧情", tag3:"离线可玩", tag4:"免费下载",
    introTitle:"关于游戏", introText:"你在一所废弃的精神病院中醒来，黑暗中潜伏着未知的危险。探索、解谜、生存，揭开这家医院背后的黑暗实验。支持 Android 与 Windows 平台。",
    downloadTitle:"选择平台下载"
  },
  en: {
    official:"Official", title:"Horror Hospital", subtitle:"Survive the abandoned hospital. Uncover the truth.",
    tag1:"Survival Horror", tag2:"Single Player", tag3:"Offline", tag4:"Free",
    introTitle:"About", introText:"You wake up in an abandoned asylum. Danger lurks in the dark. Explore, solve puzzles, survive, and reveal the dark experiments behind this hospital. Available on Android & Windows.",
    downloadTitle:"Download"
  }
};

const DIRECT_LINKS = {
  android: "https://c.wss.ink/f/l952uv2zuat",
  windows: "https://c.wss.ink/f/l951zvyd6kz"
};

let currentLang = "zh";

function applyLang(lang) {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  document.querySelectorAll(".lang-switch button").forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-lang") === lang);
  });
  currentLang = lang;
}

document.querySelectorAll(".lang-switch button").forEach(btn => {
  btn.addEventListener("click", () => applyLang(btn.getAttribute("data-lang")));
});

document.getElementById("download-android").addEventListener("click", function (e) {
  e.preventDefault();
  window.open(DIRECT_LINKS.android, "_blank", "noopener");
});

document.getElementById("download-windows").addEventListener("click", function (e) {
  e.preventDefault();
  window.open(DIRECT_LINKS.windows, "_blank", "noopener");
});

document.getElementById("download-ios").addEventListener("click", function (e) {
  e.preventDefault();
  alert(currentLang === "zh" ? "iOS 版本暂未发布" : "iOS version not yet released");
});
</script>
</body>
</html>
